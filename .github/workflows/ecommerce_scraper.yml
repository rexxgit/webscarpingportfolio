# .github/workflows/ecommerce_scraper.yml
name: E-commerce Product Scraper

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Install Chromium
      run: |
        # Install Chromium browser files without system dependencies
        python -m playwright install chromium
    
    - name: Run e-commerce scraper
      run: python scrapers/1_ecommerce_scraper.py
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/playwright
    
    - name: Commit and push results
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add output/ || true
        git diff --staged --quiet || git commit -m "Update e-commerce data [skip ci]"
        git push
